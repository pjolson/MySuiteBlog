<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4D33"/>
      <stop offset="100%" stop-color="#0E6B47"/>
    </linearGradient>
    <pattern id="brackets" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 20 40 L 10 40 L 10 120 L 20 120" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 140 40 L 150 40 L 150 120 L 140 120" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#brackets)"/>

  <!-- Content offset right to avoid profile photo overlap in lower-left -->
  <g transform="translate(560, 130)">
    <text x="0" y="0" font-size="18" font-weight="600" letter-spacing="3" fill="#2DD4A4"
          font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', sans-serif">INDEPENDENT NETSUITE CONSULTANT</text>
    <text x="0" y="65" font-size="58" font-weight="700" letter-spacing="-2" fill="#FFFFFF"
          font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', sans-serif">Your trusted</text>
    <text x="0" y="130" font-size="58" font-weight="700" letter-spacing="-2" fill="#FFFFFF"
          font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', sans-serif">NetSuite advisor.</text>
    <text x="0" y="185" font-size="18" font-weight="500" fill="#FFFFFF" fill-opacity="0.7"
          font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', sans-serif">Optimization · Customization · Support   ·   mysuite.tech</text>
  </g>
</svg>